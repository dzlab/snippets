[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "code-knowledge-graph"
version = "0.1.0"
description = "Dependency-free code knowledge graph scaffold."
requires-python = ">=3.11"
dependencies = []

[project.scripts]
codekg = "codekg.cli:main"

[tool.setuptools]
include-package-data = false

[tool.setuptools.packages.find]
include = ["codekg*"]
